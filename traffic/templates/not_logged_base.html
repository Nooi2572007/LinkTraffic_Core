{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link href="{% static 'css/base_style.css' %}" rel="stylesheet">
        <!-- <link rel="shortcut icon" type="image/png" href="favicon.ico"> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LinkTraffic {% block title %}{% endblock %}</title>
        {% block extra_css %}{% endblock %}
    </head>
    <body>
        <div class="wrapper">
            <header class="header">
                <div class="head">
                    <div class="logo">
                        <div class="title font_size_40">LinkTraff<span class="logo_color">ic</span></div>
                    </div>
                    <nav class="navi">
                        <ul class="navi_li">
                            <li class="navi_item">
                                <div class="menulist_waku">
                                    <button type="button" class="button_all button_log_all menulist_button" id="menuListBtn">
                                        <span class="font_size_28 font_bold">PASMO</span>
                                        {% comment %} <span class="font_size_20">▼</span> {% endcomment %}
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </nav>
                </div>
            </header>
            {% block contents %}{% endblock %}
            <footer class="ft">
                <h4>
                    &copy; 2026 LinkTraffic by 207-6<br class="sp_br"><span class="sp_view_none"> </span><a href="#" class="a_link_black">Ver alpha</a> 
                </h4>
            </footer>
        </div>
        <script src="{% static 'js/all.js' %}" defer></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
